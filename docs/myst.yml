version: 1

project:
  title: odezoo
  description: >-
    A curated registry of ODE models, mostly cell models, stored as CellML or gotranx .ode, and
    fetched exactly as they were recorded, verified by their sha256.
  github: https://github.com/ComputationalPhysiology/odezoo
  license:
    code: MIT
  toc:
    - file: index.md
    - file: install.md
    # Written at build time by `tools/generate_model_pages.py`: a widget with every model inline.
    # - file: search.md
    - file: cli.md
    - file: python.md
      # Written at build time by `tools/generate_api_pages.py`, one page per public module.
      children:
        - file: api/odezoo.api.md
        - file: api/odezoo.schema.md
        - file: api/odezoo.errors.md
    - file: adding-a-model.md
    # One page per model, written at build time by `tools/generate_model_pages.py`. A glob,
    # so this file never changes when models are added; the docs job counts the pages instead.
    # - title: Models
    #   children:
    #     - pattern: models/*.md

site:
  template: book-theme
