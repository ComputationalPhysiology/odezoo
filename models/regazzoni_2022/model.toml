id = "regazzoni_2022"
name = "Regazzoni 2022, closed-loop circulation"
description = "Lumped-parameter closed-loop circulation with four chambers driven by time-varying elastances, twelve states. `beat_phase`, the time modulo the heart period `RR`, is a missing variable to supply. Each chamber's pressure is in its own component (`LA`, `LV`, `RA`, `RV`), so it can be removed to take the pressure from a mechanics model."
categories = ["cardiovascular_circulation"]
keywords = ["closed loop", "lumped parameter"]
species = "human"
reviewed = true

