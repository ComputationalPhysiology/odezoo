id = "tran_2010"
name = "Tran 2010, metabolite-sensitive cardiac crossbridge cycling"
description = "Rice 2008 with a reversible crossbridge cycle that depends on MgATP, MgADP, Pi and H+, parameterised for guinea pig. Inputs `Ca` (µM), `SL` (µm) and `dSL` (µm/s) are parameters in the `inputs` component; remove that component to couple the model to an electrophysiology or tissue model. Outputs `Ta`, `Ka`, `bound_ca` and `Tp`."
categories = ["myofilament_mechanics"]
keywords = ["crossbridge", "metabolites", "active tension"]
species = "guinea pig"
reviewed = true

[paper]
title = "A metabolite-sensitive, thermodynamically constrained model of cardiac cross-bridge cycling: implications for force development during ischemia"
authors = ["Tran K", "Smith NP", "Loiselle DS", "Crampin EJ"]
journal = "Biophys J"
year = 2010
doi = "10.1016/j.bpj.2009.10.011"
pubmed = 20338848

