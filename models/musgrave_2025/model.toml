id = "musgrave_2025"
name = "Musgrave 2025, human atrial crossbridge model"
description = "Metabolite-sensitive crossbridge model fitted to permeabilized human right atrial trabeculae, at 37 °C, with the non-diabetic parameters. Inputs `Ca` (µM), `SL` (µm) and `dSL` (µm/s) are parameters in the `inputs` component; remove that component to couple the model to an electrophysiology or tissue model. Outputs `Ta`, `Ka`, `bound_ca` and `Tp`."
categories = ["myofilament_mechanics"]
keywords = ["crossbridge", "active tension"]
species = "human"
cell_type = "atrial myocyte"
reviewed = true

[paper]
title = "Metabolite-sensitive cross-bridge models of human atria reveal the impact of diabetes on muscle mechanoenergetics"
authors = ["Musgrave JH", "Han J", "Ward M", "Taberner AJ", "Tran K"]
journal = "J Physiol"
year = 2025
doi = "10.1113/JP288463"

