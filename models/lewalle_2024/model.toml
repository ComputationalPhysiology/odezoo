id = "lewalle_2024"
name = "Lewalle 2024, thick-filament force feedback"
description = "Land 2017 with two myosin OFF states whose exchange with the ON states is modulated by force. Inputs `Ca` (µM), `SL` (µm) and `dSL` (µm/s) are parameters in the `inputs` component; remove that component to couple the model to an electrophysiology or tissue model. Outputs `Ta`, `Ka`, `bound_ca` and `Tp`. The `which_dep` parameter selects what modulates the OFF-state exchange; its default, 0, is total force."
categories = ["myofilament_mechanics"]
keywords = ["crossbridge", "active tension"]
species = "human"
cell_type = "ventricular myocyte"
reviewed = true

[paper]
title = "Cardiac length-dependent activation driven by force-dependent thick-filament dynamics"
authors = ["Lewalle A", "Milburn G", "Campbell KS", "Niederer SA"]
journal = "Biophys J"
year = 2024
