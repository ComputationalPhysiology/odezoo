id = "rice_2008"
name = "Rice 2008, cardiac myofilament model"
description = "With the paper's rat parameters at 22.5 °C; where the paper and the CellML disagree, the file's header says which it follows. Inputs `Ca` (µM), `SL` (µm) and `dSL` (µm/s) are parameters in the `inputs` component; remove that component to couple the model to an electrophysiology or tissue model. Outputs `Ta`, `Ka`, `bound_ca` and `Tp`."
