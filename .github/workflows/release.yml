name: Release

on: [push, pull_request]

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Build SDist and wheel
      run: pipx run build

    - uses: actions/upload-artifact@v7
      with:
        path: dist/*

    - name: Check metadata
      run: pipx run twine check dist/*

  publish:
    needs: [dist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')
    environment: pypi
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: artifact
        path: dist

    # A version already on PyPI is left as it is, so that a re-run, or a tag for a version
    # uploaded by hand, still goes on to deploy the docs.
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

  # The site, deployed once the release is on PyPI. ci.yml builds it on every pull request.
  docs:
    if: startsWith(github.ref, 'refs/tags')
    uses: ./.github/workflows/docs.yml

  deploy:
    needs: [docs, publish]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - id: deployment
      uses: actions/deploy-pages@v4
