name: Release

# On a tag v<version>: put the package on PyPI, make the GitHub release (which Zenodo archives),
# and deploy the docs. The wheel bundles registry.json stamped with the tag's commit, which is
# what the mirror URLs are pinned to, so a release always resolves a model to the same bytes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Nothing is built, let alone published, from a tag that names another version than the
  # package's, or from a commit that is not on main.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tag names the package's version, on main
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME}, but pyproject.toml says ${version}"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "${GITHUB_SHA} is not on main"; exit 1; }

  dist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the sdist and the wheel
        env:
          ODEZOO_REGISTRY_COMMIT: ${{ github.sha }}
        run: pipx run build
      - run: pipx run twine check dist/*
      - name: The wheel's registry is this commit's, with every model
        run: |
          python3 - <<'PY'
          import glob, json, os, zipfile
          [wheel] = glob.glob("dist/*.whl")
          registry = json.loads(zipfile.ZipFile(wheel).read("odezoo/registry.json"))
          models = len(glob.glob("models/*/model.toml"))
          assert registry["commit"] == os.environ["GITHUB_SHA"], registry["commit"]
          assert len(registry["models"]) == models, (len(registry["models"]), models)
          print(f"{wheel}: commit {registry['commit']}, {models} models")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: dist
    runs-on: ubuntu-latest
    # PyPI's trusted publishing: the pending publisher names this workflow and this environment.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Zenodo's GitHub integration archives every release it sees.
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --generate-notes

  docs:
    needs: check
    uses: ./.github/workflows/docs.yml

  # The site shows what `pip install odezoo` gives, so it is deployed only once that is on PyPI.
  # One deploy at a time, and never cancel one in flight: a half-published site is worse than
  # an out-of-date one.
  deploy:
    needs: [docs, publish]
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
