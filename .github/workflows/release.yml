name: Release

on: [push, pull_request]

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Build SDist and wheel
      run: pipx run build

    - uses: actions/upload-artifact@v7
      with:
        path: dist/*

    - name: Check metadata
      run: pipx run twine check dist/*

  publish:
    needs: [dist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags')
    environment: pypi
    permissions:
      id-token: write

    steps:
    - uses: actions/download-artifact@v8
      with:
        name: artifact
        path: dist

    # A version already on PyPI is left as it is, so that a re-run of a release passes.
    - uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
