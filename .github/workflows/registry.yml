name: Registry

# Checks a pull request that touches the models: every model and file, the append-only rule
# against the branch it goes into, and that upstream serves each new version's bytes.
on:
  pull_request:
    paths:
      - "models/**"
      - "LICENSES/**"

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the base branch, for the append-only check
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # gotranx, so that registry check also loads the .ode files
      - run: python -m pip install -e . gotranx
      - name: Check every model and file
        run: odezoo --registry . registry check
      - name: Build the base branch's registry
        run: |
          git worktree add ../base "origin/${{ github.base_ref }}"
          odezoo --registry ../base registry build -o "$RUNNER_TEMP/base.json"
      - name: Check that no version of the base branch changed or went away
        run: odezoo --registry . registry check --against "$RUNNER_TEMP/base.json"
      # One request at a time, spaced out per host, and only for the versions this adds.
      - name: Check that upstream serves each new version's bytes
        run: odezoo --registry . registry upstream --new-since "$RUNNER_TEMP/base.json"
